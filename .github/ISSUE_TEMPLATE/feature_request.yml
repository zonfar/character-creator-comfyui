name: Feature request
description: Propose an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should it be validated?
      description: Describe a repeatable test or observable success condition.
