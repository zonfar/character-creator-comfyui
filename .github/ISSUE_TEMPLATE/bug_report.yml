name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private artwork, credentials, model weights, or full logs without reviewing them first.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the selected artwork, view, and visible error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, GPU/VRAM, ComfyUI version, model family, model/encoder/VAE filenames, canvas size, and custom-node versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
